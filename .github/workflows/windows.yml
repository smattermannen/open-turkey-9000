name: Windows

# The Go program on Windows (ROADMAP §4, W0–W6) on GitHub's windows-latest
# runner: build and vet; the layers and the service for real (the runner
# is a disposable administrator's machine); the unit tests.

on:
  push:
  workflow_dispatch:

jobs:
  system:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        run: |
          CGO_ENABLED=0 go build ./...
          CGO_ENABLED=0 go build -o kc9k.exe ./cmd/kc9k
      - name: Vet
        shell: bash
        run: CGO_ENABLED=0 go vet ./...
      - name: Layers for real (firewall, policies, processes)
        shell: bash
        env:
          KC9K_TEST_WFP: "1"
        run: CGO_ENABLED=0 go test -count=1 -v -run 'WFP|RegPolicy|WinProc|WinGuard|WinKill|WinDisplays|AgentEnd|Deny|ACE|UserProgram|AccelToVK|Wlan|RemoteControl|RecoveryBoot|WinGuest|WinHardwareClock|WinInstallBrowser|WinFirmware|WinBrowser|WinEdge|Strict|SameSecurity' ./internal/blocker ./internal/enforce ./internal/winagent
      - name: Desktop checks (agent, apps, titles, challenge window, hotkey, gamma, wallpaper, dark mode, winget as SYSTEM)
        timeout-minutes: 15
        # Before the service checks: their strict mode takes this
        # account's restore privilege, which a reinstall needs.
        shell: pwsh
        run: pwsh ci/windows_desktop_test.ps1 (Resolve-Path kc9k.exe)
      - name: Soak, short (W50-W52; ci/windows_soak_test.ps1)
        timeout-minutes: 25
        # One minute a phase, idle six (past the service's once-a-minute and
        # five-minute checks). -Strict: the process start trace must see a
        # PowerShell the script starts, so "0" is a real count. The script
        # must also parse in Windows PowerShell 5.1.
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Command "[void][scriptblock]::Create((Get-Content -Raw ci/windows_soak_test.ps1)); 'parses in 5.1'"
          if ($LASTEXITCODE -ne 0) { throw 'the soak script does not parse in Windows PowerShell 5.1' }
          $out = Join-Path $env:RUNNER_TEMP 'soak'
          pwsh ci/windows_soak_test.ps1 -Kc9k (Resolve-Path kc9k.exe) -Minutes 1 -IdleMinutes 6 -Strict -Out $out
          $soak = $LASTEXITCODE
          # W50, a check of its own: idle, the service starts no PowerShell.
          $idle = @(Import-Csv (Join-Path $out 'summary.csv') | Where-Object { $_.Phase -eq 'idle' })
          if ($idle.Count -ne 1) { throw 'W50: the soak has no idle phase' }
          if ([double]$idle[0].Min -lt 5) { throw "W50: idle ran $($idle[0].Min) min, want 6" }
          if ([int]$idle[0].PS -ne 0) { throw "W50: idle, the service started $($idle[0].PS) PowerShell (want 0)" }
          if ([double]$idle[0].'GP/min' -ne 0) { throw 'W50: idle, a policy refresh' }
          Write-Host "W50: idle $($idle[0].Min) min, 0 PowerShell by the service, 0 policy refreshes"
          if ($soak -ne 0) { throw "soak test exited $soak" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kc9k-soak
          path: ${{ runner.temp }}/soak
          if-no-files-found: ignore
      - name: Manifest and challenge window (kc9k.exe's manifest, ROADMAP §4.3)
        shell: bash
        run: CGO_ENABLED=0 go test -count=1 -v ./cmd/kc9k
      - name: A real WSL distribution (W24, closed by strict mode in the service checks)
        uses: Vampire/setup-wsl@v4
        continue-on-error: true
        with:
          distribution: Ubuntu-22.04
          wsl-version: 1
      - name: Service, pipe, install and uninstall
        timeout-minutes: 12
        shell: pwsh
        run: pwsh ci/windows_service_test.ps1 (Resolve-Path kc9k.exe)
      - name: Service log
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:ProgramData 'kc9k\kc9k.log'
          # Copied by a SYSTEM task: strict mode took this account's
          # take-ownership privilege for the rest of the job.
          $copy = Join-Path $env:RUNNER_TEMP 'kc9k.log'
          schtasks.exe /Create /TN kc9klog /RU SYSTEM /SC ONCE /ST 23:59 /F /TR "cmd /c copy /y $log $copy && icacls $copy /grant Everyone:R" | Out-Null
          schtasks.exe /Run /TN kc9klog | Out-Null
          Start-Sleep -Seconds 5
          if (Test-Path $copy) { Get-Content $copy -Tail 300 }
          schtasks.exe /Delete /TN kc9klog /F | Out-Null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kc9k-windows
          path: kc9k.exe
          if-no-files-found: ignore

  unit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        shell: bash
        run: CGO_ENABLED=0 go test -timeout 40m ./...
