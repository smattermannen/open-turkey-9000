name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: CGO_ENABLED=0 go test ./...
      - name: Check the interface syntax
        run: for f in gui/kc9k-gui.py gui/kc9k_gui/*.py; do python3 -m py_compile "$f" || exit 1; done
      - name: Extension matching
        run: node ci/match_test.js
      - name: Extension background as in IronFox (Android)
        run: node ci/android_background_test.js
      - name: Typing challenge in a terminal
        run: |
          CGO_ENABLED=0 go build -o /tmp/try-challenge ./cmd/try-challenge
          python3 ci/challenge_test.py /tmp/try-challenge
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables python3-gi python3-gi-cairo python3-cairo gir1.2-gtk-3.0 xvfb imagemagick dbus-x11
      - name: GTK circadian smoke (clip curves, A14)
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 ci/gui_circadian_smoke.py
      - name: GTK dialogs, Enter presses OK (A15)
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 ci/gui_enter_smoke.py
      - name: GTK Account page against the fake cloud (2.10)
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 ci/gui_account_smoke.py
      - name: Extension background (frames, ad trigger, local files)
        run: node ci/background_test.js
      - name: Search results in Chromium (R-PAGE-2)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node ci/search_results_test.js
      # LibreWolf before KC9K: these two stand in for the daemon on 47613.
      - name: Install LibreWolf
        run: |
          sudo apt-get install -y extrepo
          sudo extrepo enable librewolf
          sudo apt-get update
          sudo apt-get install -y librewolf
          python3 -m pip install --break-system-packages selenium
      - name: Search results in LibreWolf (R-PAGE-2)
        run: python3 ci/search_results_librewolf_test.py
      - name: Dark pages turn on the browser's dark mode (2.16)
        run: python3 ci/dark_browser_test.py
      - name: Install Killer Chicken 9000
        run: sudo env "PATH=$PATH" ./install.sh
      - name: Integration tests
        timeout-minutes: 25
        run: bash ci/integration.sh
      - name: Boot lock
        run: bash ci/bootlock.sh
      - name: Master password
        run: bash ci/master.sh
      - name: Interface screenshot
        run: bash ci/screenshot.sh
      - name: Browser tests
        run: python3 ci/browser_test.py
      - name: Daemon log
        if: always()
        run: sudo journalctl -u kc9k --no-pager | tail -100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore

  # The one-click installer (2.11): the .deb installs on a clean Ubuntu
  # 24.04 (Linux Mint 22's base) and does all install.sh does, LibreWolf
  # installed by the daemon included; then it removes.
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the .deb
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          sh "$GITHUB_WORKSPACE/packaging/build-deb.sh" 0.0.0~ci
      - name: The .deb installs, sets everything up and removes
        timeout-minutes: 25
        run: |
          sudo apt-get update
          sudo LIBREWOLF_MINUTES=15 bash ci/deb_install_check.sh "$RUNNER_TEMP"/out/kc9k_0.0.0~ci_amd64.deb 0.0.0~ci
      - name: Daemon log
        if: always()
        run: |
          sudo journalctl -u kc9k --no-pager | tail -60
          sudo journalctl -u kc9k-librewolf-install --no-pager | tail -40

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build and unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: The phone's rules in the extension's matcher
        run: node ci/android_rules_test.js
