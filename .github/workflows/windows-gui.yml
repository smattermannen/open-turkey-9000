name: Windows GUI

# W4 (GUI) and W7 (installer): build and test windows/ on windows-latest.
# The GUI runs against the fake kc9k (fixtures from the real CLI); the
# screenshots are uploaded for a person to look at.
on:
  push:
    paths:
      - "windows/**"
      - "internal/cli/**"
      - ".github/workflows/windows-gui.yml"
  workflow_dispatch:
    inputs:
      filter:
        description: "Only these UI tests (dotnet test --filter), e.g. FullyQualifiedName~ParityRealTests"
        required: false
        default: ""

jobs:
  gui:
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: windows/gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Unit tests
        run: dotnet test Kc9k.Tests -c Release --logger "console;verbosity=normal"
      - name: Build the GUI
        run: dotnet publish Kc9k.Gui -c Release -r win-x64 -o ${{ runner.temp }}\gui
      - name: Build the fake kc9k
        run: dotnet publish FakeKc9k -c Release -r win-x64 --self-contained false -o ${{ runner.temp }}\fake
      - name: What was published
        run: |
          Get-ChildItem ${{ runner.temp }}\gui -Filter *.pri | Format-Table Name, Length
          Get-ChildItem ${{ runner.temp }}\gui | Measure-Object | Select-Object Count
      - name: Screen
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | Format-List
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build and install the real kc9k.exe (Core)
        continue-on-error: true
        shell: pwsh
        working-directory: .
        run: |
          $env:CGO_ENABLED = "0"
          go build -o "${{ runner.temp }}\kc9k\kc9k.exe" ./cmd/kc9k
          # W32: the same exe on a scratch database (KC9K_DB), for the parity tests.
          "KC9K_SCRATCH_EXE=${{ runner.temp }}\kc9k\kc9k.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "${{ runner.temp }}\kc9k\kc9k.exe" install
          "KC9K_REAL_EXE=$env:ProgramFiles\KC9K\kc9k.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      # The runner's 1024×768 holds little of a page: 1920×1080 at 100 %, so
      # the window (1280×900 in the tests) is all on screen.
      - name: Display at 1920×1080
        run: pwsh tools/display-scale.ps1 -Percent 100 -Width 1920 -Height 1080
      - name: UI Automation smoke tests
        env:
          KC9K_GUI_EXE: ${{ runner.temp }}\gui\kc9k-gui.exe
          KC9K_FAKE_EXE: ${{ runner.temp }}\fake\kc9k.exe
          KC9K_SCREENSHOTS: ${{ github.workspace }}\screenshots
          KC9K_UI_FILTER: ${{ inputs.filter }}
        run: dotnet test Kc9k.UiTests -c Release $(if ($env:KC9K_UI_FILTER) { "--filter", $env:KC9K_UI_FILTER }) --logger "console;verbosity=normal" --logger "trx;LogFileName=ui.trx" --results-directory "${{ runner.temp }}\ui-results"
      # W4/W54: the display itself at 150 % and 200 % (as the owner's laptop),
      # not only the text size: the geometry and page tests again at that DPI.
      # A scale the runner's display can't reach is said in the step's log.
      - name: Display at 150 %
        id: scale150
        if: always()
        continue-on-error: true
        run: pwsh tools/display-scale.ps1 -Percent 150
      - name: UI tests at 150 % display scale
        if: always() && steps.scale150.outcome == 'success' && inputs.filter == ''
        env:
          KC9K_GUI_EXE: ${{ runner.temp }}\gui\kc9k-gui.exe
          KC9K_FAKE_EXE: ${{ runner.temp }}\fake\kc9k.exe
          KC9K_SCREENSHOTS: ${{ github.workspace }}\screenshots\display-150
        run: dotnet test Kc9k.UiTests -c Release --no-build --filter "FullyQualifiedName~GeometryTests|FullyQualifiedName~SmokeTests.EveryPageOpens|FullyQualifiedName~AccessibilityTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=ui-150.trx" --results-directory "${{ runner.temp }}\ui-results"
      - name: Display at 200 %
        id: scale200
        if: always()
        continue-on-error: true
        run: pwsh tools/display-scale.ps1 -Percent 200
      - name: UI tests at 200 % display scale
        if: always() && steps.scale200.outcome == 'success' && inputs.filter == ''
        env:
          KC9K_GUI_EXE: ${{ runner.temp }}\gui\kc9k-gui.exe
          KC9K_FAKE_EXE: ${{ runner.temp }}\fake\kc9k.exe
          KC9K_SCREENSHOTS: ${{ github.workspace }}\screenshots\display-200
        run: dotnet test Kc9k.UiTests -c Release --no-build --filter "FullyQualifiedName~GeometryTests|FullyQualifiedName~SmokeTests.EveryPageOpens|FullyQualifiedName~AccessibilityTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=ui-200.trx" --results-directory "${{ runner.temp }}\ui-results"
      - name: Uninstall the real kc9k.exe
        if: always()
        continue-on-error: true
        shell: pwsh
        run: if ($env:KC9K_REAL_EXE -and (Test-Path $env:KC9K_REAL_EXE)) { & $env:KC9K_REAL_EXE uninstall --yes; & $env:KC9K_REAL_EXE uninstall }
      - name: GUI log
        if: always()
        run: |
          $log = Join-Path $env:LOCALAPPDATA "kc9k\gui.log"
          if (Test-Path $log) { Get-Content $log -Tail 60 } else { "no log" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-gui-screenshots
          path: screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kc9k-gui
          path: ${{ runner.temp }}\gui
          retention-days: 7
      - name: Failed UI tests (last, so a log tail shows them)
        if: failure()
        shell: pwsh
        run: |
          $all = Get-ChildItem "${{ runner.temp }}\ui-results" -Filter *.trx -ErrorAction SilentlyContinue
          if (-not $all) { "no trx"; exit 0 }
          foreach ($trx in $all) {
            [xml]$x = Get-Content $trx.FullName
            foreach ($r in $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' }) {
              "FAILED ($($trx.Name)) $($r.testName)"
              (($r.Output.ErrorInfo.Message | Out-String).Trim() -split "`n" | Select-Object -First 6) | ForEach-Object { "    $_" }
            }
          }

  installer:
    # W7: the MSI built (twice, to test a reinstall), installed, removed,
    # and refused while locked, on a disposable runner.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      # Or Azure Artifact Signing (sign.ps1): the account and who may sign.
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build kc9k.exe, the GUI and the custom actions
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          # One kc9k.exe per version the checks install (W41: kc9k version tells them apart).
          foreach ($v in "0.1.0", "0.0.9", "0.2.0") {
            go build -ldflags "-X github.com/smattermannen/kc9k/internal/cli.Version=$v" -o "$env:RUNNER_TEMP\kc9k-$v\kc9k.exe" ./cmd/kc9k
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\kc9k" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\kc9k-0.1.0\kc9k.exe" "$env:RUNNER_TEMP\kc9k\kc9k.exe"
          dotnet publish windows/gui/Kc9k.Gui -c Release -r win-x64 -o "$env:RUNNER_TEMP\gui"
          dotnet build windows/installer/Actions -c Release -o "$env:RUNNER_TEMP\actions"
          Get-ChildItem "$env:RUNNER_TEMP\actions" -Filter *.CA.dll | Format-Table Name, Length
          dotnet publish windows/installer/MsiUi -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP\msiui"
          "KC9K_MSIUI=$env:RUNNER_TEMP\msiui\MsiUi.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      # Code signing (SPEC §6 2026-11-21 later): with the owner's certificate
      # configured (secrets SIGNING_PFX_BASE64 and SIGNING_PFX_PASSWORD), the
      # programs and the MSI are signed; without it the build is unsigned.
      - name: Sign the programs
        if: env.SIGNING_PFX_BASE64 != '' || env.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: pwsh windows/installer/sign.ps1 "$env:RUNNER_TEMP\kc9k\kc9k.exe" "$env:RUNNER_TEMP\gui\kc9k-gui.exe"
      - name: Build the MSIs
        shell: pwsh
        run: |
          $ca = (Get-ChildItem "$env:RUNNER_TEMP\actions" -Filter *.CA.dll | Select-Object -First 1).FullName
          # A and B: 0.1.0 twice (a reinstall); Older 0.0.9; Newer 0.2.0.
          foreach ($m in @(@("A", "0.1.0"), @("B", "0.1.0"), @("Older", "0.0.9"), @("Newer", "0.2.0"))) {
            $n, $v = $m
            Remove-Item -Recurse -Force windows/installer/obj, windows/installer/bin -ErrorAction SilentlyContinue
            dotnet build windows/installer -c Release --no-incremental -p:GuiDir="$env:RUNNER_TEMP\gui" -p:Kc9kExe="$env:RUNNER_TEMP\kc9k-$v\kc9k.exe" -p:ActionsDll="$ca" -p:Version=$v
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $msi = Get-ChildItem windows/installer/bin -Recurse -Filter *.msi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            Write-Host "built $($msi.FullName) ($($msi.Length) bytes)"
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\msi" | Out-Null
            Copy-Item $msi.FullName "$env:RUNNER_TEMP\msi\KillerChicken9000-$n.msi"
          }
      # W42: the signing path proven with a throwaway self-signed certificate
      # (on copies), so the owner's certificate only has to be added.
      - name: Signing works (throwaway certificate)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=KC9K CI throwaway" -CertStoreLocation Cert:\CurrentUser\My
          $pw = [guid]::NewGuid().ToString()
          $pfx = Join-Path $env:RUNNER_TEMP "throwaway.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pw -AsPlainText -Force) | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP "signed-copies"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "$env:RUNNER_TEMP\kc9k\kc9k.exe", "$env:RUNNER_TEMP\gui\kc9k-gui.exe", "$env:RUNNER_TEMP\msi\KillerChicken9000-A.msi" $dir
          $env:SIGNING_PFX_BASE64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx))
          $env:SIGNING_PFX_PASSWORD = $pw
          $env:AZURE_SIGNING_ACCOUNT = "" # this check signs with the throwaway certificate only
          pwsh windows/installer/sign.ps1 (Get-ChildItem $dir | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $bad = 0
          foreach ($f in Get-ChildItem $dir) {
            $sig = Get-AuthenticodeSignature $f.FullName
            Write-Host "$($f.Name): $($sig.Status) by $($sig.SignerCertificate.Subject)"
            if ($sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { $bad++ }
          }
          Remove-Item $cert.PSPath
          if ($bad -gt 0) { Write-Host "$bad file(s) not signed"; exit 1 }
      - name: Sign the MSI
        if: env.SIGNING_PFX_BASE64 != '' || env.AZURE_SIGNING_ACCOUNT != ''
        shell: pwsh
        run: pwsh windows/installer/sign.ps1 "$env:RUNNER_TEMP\msi\KillerChicken9000-A.msi"
      - name: Install, remove, refuse while locked, upgrade, downgrade, repair
        shell: pwsh
        run: pwsh windows/installer/test-msi.ps1 -A "$env:RUNNER_TEMP\msi\KillerChicken9000-A.msi" -B "$env:RUNNER_TEMP\msi\KillerChicken9000-B.msi" -Older "$env:RUNNER_TEMP\msi\KillerChicken9000-Older.msi" -Newer "$env:RUNNER_TEMP\msi\KillerChicken9000-Newer.msi"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kc9k-msi
          path: |
            ${{ runner.temp }}/msi/KillerChicken9000-A.msi
            ${{ runner.temp }}/msi-logs/
          if-no-files-found: ignore
