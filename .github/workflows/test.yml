name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: CGO_ENABLED=0 go test ./...
      - name: Check the interface syntax
        run: python3 -m py_compile gui/kc9k-gui.py
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iptables python3-gi gir1.2-gtk-3.0 xvfb imagemagick dbus-x11
      - name: Install Killer Chicken 9000
        run: sudo env "PATH=$PATH" ./install.sh
      - name: Integration tests
        run: bash ci/integration.sh
      - name: Boot lock
        run: bash ci/bootlock.sh
      - name: Master password
        run: bash ci/master.sh
      - name: Interface screenshot
        run: bash ci/screenshot.sh
      - name: Install LibreWolf
        run: |
          sudo apt-get install -y extrepo
          sudo extrepo enable librewolf
          sudo apt-get update
          sudo apt-get install -y librewolf
          python3 -m pip install --break-system-packages selenium
      - name: Browser tests
        run: python3 ci/browser_test.py
      - name: Daemon log
        if: always()
        run: sudo journalctl -u kc9k --no-pager | tail -100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
